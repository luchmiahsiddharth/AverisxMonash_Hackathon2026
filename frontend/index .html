<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SDOC Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div>
            <h1>SDOC || Shipping Document Review</h1>
            <p>Document Verification & Email Review System</p>
        </div>

        <div id="stats">
            Loading...
        </div>
    </header>


    <!-- MAIN LAYOUT -->
    <div class="layout">

        <!-- EMAIL LIST -->
        <div class="list-pane">

            <div class="search-wrap">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search emails..."
                >
            </div>

            <div id="email-list">
                <div class="loading-state">
                    Loading emails...
                </div>
            </div>

        </div>


        <!-- EMAIL DETAILS -->
        <div class="detail-pane" id="detail">

            <div class="detail-placeholder">
                <div>←</div>
                <div>Select an email to see its review</div>
            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="app.js"></script>

</body>

</html>
