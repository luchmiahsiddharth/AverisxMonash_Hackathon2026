<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SDOC Dashboard</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div>
            <h1>SDOC || Shipping Document Review</h1>
            <p>Document Verification & Email Review System</p>
        </div>

        <div id="stats">
            Loading...
        </div>
    </header>


    <!-- MAIN LAYOUT -->
    <div class="layout">

        <!-- EMAIL LIST -->
        <div class="list-pane">

            <div class="search-wrap">
                <div class="filters" style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="BL_COMPARISON">BL Compare</button>
                    <button class="filter-btn" data-filter="NEEDS_REVIEW">Needs Review</button>
                    <button class="filter-btn" data-filter="MISMATCH">Mismatches</button>
                </div>
                <div class="search-input">
                    <input type="text" id="searchInput" placeholder="Search emails...">
                </div>
            </div>

            <div id="email-list">
                <div class="loading-state">
                    Loading emails...
                </div>
            </div>

        </div>


        <!-- EMAIL DETAILS -->
        <div class="detail-pane" id="detail">

            <div class="detail-placeholder">
                <div>←</div>
                <div>Select an email to see its review</div>
            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="/static/app.js"></script>

</body>

</html>
